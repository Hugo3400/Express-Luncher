name: Build

# Intégration continue : compile la solution à chaque push / pull request sur main,
# puis vérifie que la publication « exe autonome en un seul fichier » (celle des releases) fonctionne.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Compiler
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer
        run: dotnet restore ExpressLuncher.slnx

      - name: Compiler la solution
        run: dotnet build ExpressLuncher.slnx -c Release --no-restore

      # Mêmes options que .github/workflows/release.yml : une release ne doit pas échouer le jour du tag.
      - name: Vérifier la publication
        shell: pwsh
        run: >
          dotnet publish src/ExpressLuncher/ExpressLuncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish
